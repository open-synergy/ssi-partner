scenarios:
  - name: "Create bank account usage"
    steps:
      - step: "Create record"
        action: "create"
        model: "res_partner_bank_usage"
        save_as: "record"
        values:
          name: "Operational"
          code: "/"
      - step: "Assert created"
        action: "assert"
        target: "record"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Operational"

  - name: "Edit bank account usage name"
    steps:
      - step: "Create record"
        action: "create"
        model: "res_partner_bank_usage"
        save_as: "record"
        values:
          name: "Operational"
          code: "/"
      - step: "Write new name"
        action: "write"
        target: "record"
        values:
          name: "Payroll"
      - step: "Assert name updated"
        action: "assert"
        target: "record"
        asserts:
          name:
            type: "value"
            expected: "Payroll"

  - name: "Delete bank account usage"
    steps:
      - step: "Create record"
        action: "create"
        model: "res_partner_bank_usage"
        save_as: "record"
        values:
          name: "Temporary"
          code: "/"
      - step: "Delete record"
        action: "unlink"
        target: "record"
      - step: "Verify deleted"
        action: "search"
        model: "res_partner_bank_usage"
        domain: [["name", "=", "Temporary"]]
        save_as: "result"
        expect_count: 0
