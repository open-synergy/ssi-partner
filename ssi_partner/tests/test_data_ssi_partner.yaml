scenarios:
  - name: "Partner - Create Religion Master Data"
    steps:
      - step: "Create religion"
        action: "create"
        model: "res_partner_religion"
        save_as: "religion"
        values:
          name: "Test Religion"
          code: "TST-REL"

      - step: "Assert religion created"
        action: "assert"
        target: "religion"
        asserts:
          name:
            type: "value"
            expected: "Test Religion"

  - name: "Partner - Create Ethnicity Master Data"
    steps:
      - step: "Create ethnicity"
        action: "create"
        model: "res_partner_ethnicity"
        save_as: "ethnicity"
        values:
          name: "Test Ethnicity"
          code: "TST-ETH"

      - step: "Assert ethnicity created"
        action: "assert"
        target: "ethnicity"
        asserts:
          name:
            type: "value"
            expected: "Test Ethnicity"

  - name: "Partner - Create Company Entity Type"
    steps:
      - step: "Create entity type"
        action: "create"
        model: "company_entity_type"
        save_as: "entity_type"
        values:
          name: "Test Entity Type"
          code: "TST-ENT"

      - step: "Assert entity type created"
        action: "assert"
        target: "entity_type"
        asserts:
          name:
            type: "value"
            expected: "Test Entity Type"

  - name: "Partner - Create Company Ownership Type"
    steps:
      - step: "Create ownership type"
        action: "create"
        model: "company_ownership_type"
        save_as: "ownership_type"
        values:
          name: "Test Ownership Type"
          code: "TST-OWN"

      - step: "Assert ownership type created"
        action: "assert"
        target: "ownership_type"
        asserts:
          name:
            type: "value"
            expected: "Test Ownership Type"

  - name: "Partner - Create Bank Account Usage Master Data"
    steps:
      - step: "Create bank account usage"
        action: "create"
        model: "res_partner_bank_usage"
        save_as: "usage"
        values:
          name: "Operational"
          code: "TST-USG"

      - step: "Assert bank account usage created"
        action: "assert"
        target: "usage"
        asserts:
          name:
            type: "value"
            expected: "Operational"

  - name: "Partner - Bank Account Usage is Optional and Linkable"
    steps:
      - step: "Create bank account usage"
        action: "create"
        model: "res_partner_bank_usage"
        save_as: "usage"
        values:
          name: "Payroll"
          code: "TST-USG2"

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Bank Partner"

      - step: "Create bank account without usage"
        action: "create"
        model: "res.partner.bank"
        save_as: "bank"
        values:
          acc_number: "1234567890"
          partner_id: "EVAL: registry['partner'].id"

      - step: "Assert bank account created without usage"
        action: "assert"
        target: "bank"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          usage_id:
            type: "value"
            operator: "is_falsy"

      - step: "Set usage on bank account"
        action: "write"
        target: "bank"
        values:
          usage_id: "EVAL: registry['usage'].id"

      - step: "Verify bank account linked to usage"
        action: "search"
        model: "res.partner.bank"
        domain:
          - - "id"
            - "="
            - "EVAL: registry['bank'].id"
          - - "usage_id"
            - "="
            - "EVAL: registry['usage'].id"
        save_as: "result"
        expect_count: 1

  - name: "Partner - Nickname is Stored on Create"
    steps:
      - step: "Create individual partner with nickname"
        action: "create"
        model: "res.partner"
        save_as: "partner_nickname"
        values:
          name: "Test Nickname Partner"
          is_company: false
          nickname: "Nick"

      - step: "Assert nickname stored as given"
        action: "assert"
        target: "partner_nickname"
        asserts:
          nickname:
            type: "value"
            expected: "Nick"

  - name: "Partner - Nickname can be Updated via Write"
    steps:
      - step: "Create individual partner with nickname"
        action: "create"
        model: "res.partner"
        save_as: "partner_nickname_write"
        values:
          name: "Test Nickname Write Partner"
          is_company: false
          nickname: "Old Nick"

      - step: "Write new nickname"
        action: "write"
        target: "partner_nickname_write"
        values:
          nickname: "New Nick"

      - step: "Assert nickname changed to new value"
        action: "assert"
        target: "partner_nickname_write"
        asserts:
          nickname:
            type: "value"
            expected: "New Nick"

  - name: "Partner - Nickname is Optional"
    steps:
      - step: "Create individual partner without nickname"
        action: "create"
        model: "res.partner"
        save_as: "partner_no_nickname"
        values:
          name: "Test No Nickname Partner"
          is_company: false

      - step: "Assert partner created successfully without nickname"
        action: "assert"
        target: "partner_no_nickname"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          nickname:
            type: "value"
            operator: "is_falsy"
