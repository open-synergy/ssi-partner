scenarios:
  - name: "Create partner religion"
    steps:
      - step: "Create record"
        action: "create"
        model: "res_partner_religion"
        save_as: "record"
        values:
          name: "Islam"
          code: "/"
      - step: "Assert created"
        action: "assert"
        target: "record"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Islam"

  - name: "Edit partner religion name"
    steps:
      - step: "Create record"
        action: "create"
        model: "res_partner_religion"
        save_as: "record"
        values:
          name: "Islam"
          code: "/"
      - step: "Write new name"
        action: "write"
        target: "record"
        values:
          name: "Christianity"
      - step: "Assert name updated"
        action: "assert"
        target: "record"
        asserts:
          name:
            type: "value"
            expected: "Christianity"

  - name: "Delete partner religion"
    steps:
      - step: "Create record"
        action: "create"
        model: "res_partner_religion"
        save_as: "record"
        values:
          name: "Temporary"
          code: "/"
      - step: "Delete record"
        action: "unlink"
        target: "record"
      - step: "Verify deleted"
        action: "search"
        model: "res_partner_religion"
        domain: [["name", "=", "Temporary"]]
        save_as: "result"
        expect_count: 0
